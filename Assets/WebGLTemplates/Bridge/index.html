<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
#if !PROGRESSIVE_ASSET_LOADING
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
#endif
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <style>
            * {
                box-sizing: border-box;
            }
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                background-color: #0b0c10;
                background: radial-gradient(circle at center, #181b29 0%, #07080c 100%);
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #canvas {
                background: #14151f;
                display: block;
                /* Enforce 9:16 portrait on desktop / landscape monitors */
                height: 100vh;
                width: auto;
                aspect-ratio: 9 / 16;
                max-width: calc(100vh * (9 / 16));
                max-height: 100vh;
                box-shadow: 0 0 50px rgba(0, 0, 0, 0.85), 0 0 15px rgba(0, 0, 0, 0.5);
                border-radius: 4px;
            }
            /* Fill screen cleanly on portrait devices / narrow viewports */
            @media (max-aspect-ratio: 9/16) {
                #canvas {
                    width: 100vw;
                    height: 100vh;
                    max-width: 100vw;
                    max-height: 100vh;
                    aspect-ratio: auto;
                    border-radius: 0px;
                    box-shadow: none;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>

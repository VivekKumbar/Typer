<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                background: #000;
                overflow: hidden;
            }
            /* Locks the canvas to the game's 1080:1920 portrait aspect ratio
               and scales it to fit the browser window -- never stretched,
               just letterboxed (bars on the sides/top-bottom) when the
               window's own aspect ratio doesn't match. The width/height +
               max-width/max-height pair is the standard CSS trick for this:
               each dimension is capped by what the OTHER dimension allows
               for the given ratio, so whichever axis is the tighter
               constraint wins and the box shrinks to fit inside it. */
            .fullscreen-canvas {
                background: #242424;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                aspect-ratio: 1080 / 1920;
                width: 100vw;
                height: 100vh;
                max-width: calc(100vh * 1080 / 1920);
                max-height: calc(100vw * 1920 / 1080);
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
